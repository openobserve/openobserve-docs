name: Deploy Docs Site to S3 (staging)

on:
  push:
    branches:
      - dev   # Change this to your deployment branch

jobs:
  deploy:
    runs-on: org-openobserve-standard-4
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0   # full history so `lastModified` can read per-page commit dates

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # Node 22 is required, not preferred: fumadocs-mdx ships its bundler
        # loaders as ESM and the loader runner require()s them, which needs
        # Node's require(esm) support (20.19+ / 22.12+).
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install AWS CLI
      run: |
        if ! command -v aws &> /dev/null; then
          echo "AWS CLI not found. Installing..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
        else
          echo "AWS CLI already installed."
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::325553860333:role/GitHubActionsRole
        aws-region: us-east-2  # or your preferred region

    - name: Build docs site
      # gen-nav → next build → asset sync, raw markdown, redirects, sitemap.
      run: |
        rm -rf out
        npm run build

    - name: Check strict rules
      # S-1: docs/ must be unmodified by the build. S-2: no .mdx under docs/.
      run: npm run check:rules

    - name: Deploy to S3
      run: |
        aws s3 sync ./out s3://openobserve-website-staging/docs --exclude=".git/*" --delete

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id E2GZJM0TJIDFRM --paths "/docs/*"
