version: 0.2

# Docs are built with Fumadocs (Next.js static export), not MkDocs.
#
# Node 22 is required, not merely preferred: fumadocs-mdx ships its bundler
# loaders as ESM and the loader runner `require()`s them, which needs Node's
# require(esm) support — Node 20.19 or 22.12 and above. On older Node every one
# of the 456 content files fails to load.

phases:
  install:
    runtime-versions:
      nodejs: 22

  pre_build:
    commands:
      - node --version
      - npm ci

  build:
    commands:
      - GIT_COMMIT_HASH="$(git rev-parse --short HEAD)"
      # `npm run build` runs, in order: gen-nav → next build → asset sync,
      # raw-markdown endpoints, redirect stubs, sitemap.
      - npm run build
      # Rules S-1 and S-2: docs/ must be untouched and free of .mdx.
      - npm run check:rules
      # Deploy artifact is out/, not site/.
      - aws s3 cp ./out s3://zincdocs-dev/$GIT_COMMIT_HASH/ --recursive
      - echo "Deployed to http://zincdocs-dev.s3-website-us-west-2.amazonaws.com/$GIT_COMMIT_HASH/"

cache:
  paths:
    - node_modules/**/*
