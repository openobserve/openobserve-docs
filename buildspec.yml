version: 0.2

phases:
  pre_build:
    commands:
      - apt-get update && export DEBIAN_FRONTEND=noninteractive && apt-get -y install --no-install-recommends nodejs npm
      - npm install -g pnpm
      - pnpm install --frozen-lockfile
  build:
    commands:
      - GIT_COMMIT_HASH="$(git rev-parse --short HEAD)"
      - pnpm build
      - aws s3 cp ./out s3://zincdocs-dev/$GIT_COMMIT_HASH/ --recursive
      - echo "Deployed to http://zincdocs-dev.s3-website-us-west-2.amazonaws.com/$GIT_COMMIT_HASH/"
